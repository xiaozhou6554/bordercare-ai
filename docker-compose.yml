services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-research}
      MYSQL_USER: ${MYSQL_USER:-research}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      AUTH_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-research}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-research}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ROLE: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "scr.worker"]
    environment:
      APP_ENV: production
      AUTH_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-research}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-research}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ROLE: worker
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
