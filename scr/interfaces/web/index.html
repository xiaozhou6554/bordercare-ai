<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境电商选品调研 Agent</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e6eaf2; --txt:#1c2333; --sub:#6b7488;
  --primary:#3d6be5; --primary-soft:#eef3ff; --green:#16a34a; --green-soft:#e8f7ee;
  --orange:#ea8a00; --orange-soft:#fdf3e2; --red:#dc4b4b; --red-soft:#fdecec;
  --sidebar:#10182b; --sidebar-txt:#aab4cc; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;display:flex;height:100vh;overflow:hidden}

/* ===== 左侧栏 ===== */
aside{width:228px;min-width:228px;height:100vh;min-height:0;background:var(--sidebar);color:var(--sidebar-txt);display:flex;flex-direction:column;overflow:hidden;padding:18px 14px}
.logo{display:flex;align-items:center;gap:10px;flex:none;padding:2px 6px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4d7cff,#2b4fd0);display:flex;align-items:center;justify-content:center;font-size:17px}
.logo b{color:#fff;font-size:14.5px;display:block}
.logo span{font-size:11px;color:#7a86a3}
.sec-title{flex:none;font-size:11px;color:#66718f;margin:18px 6px 8px;letter-spacing:1px}
.act{display:flex;flex:none;align-items:center;gap:9px;padding:9px 10px;border:1px solid transparent;background:transparent;color:inherit;text-align:left;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;transition:.15s}
.act:hover{background:rgba(255,255,255,.07);color:#fff}
.act.on{background:linear-gradient(90deg,rgba(77,124,255,.28),rgba(77,124,255,.08));color:#fff;border:1px solid rgba(99,140,255,.35)}
.act .ic{width:16px;text-align:center}
.history-list{flex:1 1 0;min-height:64px;max-height:none;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(170,180,204,.35) transparent}.history-empty{padding:7px 10px;color:#68738f;font-size:11px;line-height:1.6}.hist{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;cursor:pointer;color:#8e99b4}
.hist:hover{background:rgba(255,255,255,.06);color:#dfe5f2}.history-item{display:grid;grid-template-columns:1fr auto;gap:3px 6px;padding:7px 8px;border-radius:8px;font-size:11px;color:#aab4cc}.history-item:hover{background:rgba(255,255,255,.06)}.history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.history-meta{font-size:10px;color:#74809c}.history-actions{display:flex;gap:4px;align-items:center}.history-actions button{border:0;background:transparent;color:#aab4cc;cursor:pointer;font-size:11px;padding:2px}.history-actions button:hover{color:#fff}
.hist small{margin-left:auto;font-size:10.5px;color:#5d6884}
.cache-card{flex:0 1 auto;min-height:0;max-height:30vh;overflow-y:auto;overscroll-behavior:contain;margin-top:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 12px;font-size:11.5px;line-height:1.9;scrollbar-width:thin;scrollbar-color:rgba(170,180,204,.35) transparent}
.cache-card b{color:#d7deee}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:5px}

/* ===== 主区 ===== */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px}
header h1{font-size:16px;font-weight:600}
.mkt{display:flex;gap:4px;background:#f0f3f9;border-radius:99px;padding:3px}
.mkt button{border:0;background:transparent;padding:4px 13px;border-radius:99px;font:inherit;font-size:12px;cursor:pointer;color:var(--sub)}
.mkt button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(30,50,100,.12)}
.hd-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.badge.gray{background:#f0f3f9;color:var(--sub)}

#chat{flex:1;overflow-y:auto;padding:20px 26px 10px;scroll-behavior:smooth}
.wrap{max-width:920px;margin:0 auto}

/* 用户气泡 */
.umsg{display:flex;justify-content:flex-end;margin:14px 0}
.umsg .b{background:var(--primary);color:#fff;padding:10px 16px;border-radius:14px 14px 3px 14px;max-width:70%;font-size:13.5px}

/* 卡片通用 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:10px 0;box-shadow:0 1px 3px rgba(20,35,80,.04)}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:24px;height:24px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px}
.agent-row{display:flex;gap:10px;margin:12px 0}
.avatar{width:30px;height:30px;min-width:30px;border-radius:9px;background:linear-gradient(135deg,#4d7cff,#2b4fd0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.agent-body{flex:1;min-width:0}

/* 意图识别卡 */
.intent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.tag{padding:3px 11px;border-radius:99px;font-size:12px;background:var(--primary-soft);color:var(--primary)}
.tag.dark{background:#eef1f6;color:#414c63}
.tag.ok{background:var(--green-soft);color:var(--green)}

/* Pipeline 步骤条 */
.stage{display:flex;gap:12px;position:relative;padding-bottom:6px}
.rail{display:flex;flex-direction:column;align-items:center;width:26px;min-width:26px}
.node{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#eef1f6;color:#9aa3b8;border:2px solid #e3e8f1;z-index:1}
.node.run{background:#fff;color:var(--primary);border-color:var(--primary);animation:pulse 1.1s infinite}
.node.done{background:var(--green);border-color:var(--green);color:#fff}
.node.skip{background:#eef1f6;border-color:#e3e8f1;color:#9aa3b8}
.node.abort{background:var(--red);border-color:var(--red);color:#fff}
.node.fail{background:var(--orange);border-color:var(--orange);color:#fff}
.rail .vline{width:2px;flex:1;background:#e3e8f1;margin-top:2px}
.rail .vline.off{background:transparent}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,107,229,.35)}50%{box-shadow:0 0 0 6px rgba(61,107,229,0)}}
.s-main{flex:1;min-width:0;padding-bottom:14px}
.s-head{display:flex;align-items:center;gap:9px;padding-top:2px}
.s-head b{font-size:13.5px}
.s-head .st{font-size:11px;color:var(--sub)}
.s-head .cached{font-size:10.5px;color:var(--orange);background:var(--orange-soft);border-radius:99px;padding:1px 8px}
.s-body{margin-top:9px}
.mini{font-size:12px;color:var(--sub);background:#f8f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 12px}

/* 指标网格 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kpi{background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--sub);margin-bottom:4px}
.kpi .v{font-size:17px;font-weight:700}
.kpi .v small{font-size:11px;color:var(--sub);font-weight:400}
.kpi .d{font-size:10.5px;margin-top:2px;color:var(--green)}
.kpi .d.neg{color:var(--red)}

/* 来源/置信度脚注 */
.src{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub);align-items:center}
.conf{padding:1px 9px;border-radius:99px;font-size:10.5px}
.conf.High{background:var(--green-soft);color:var(--green)}
.conf.Medium{background:var(--orange-soft);color:var(--orange)}
.conf.Low{background:var(--red-soft);color:var(--red)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f6f8fc;color:var(--sub);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #f0f2f7}
tr:last-child td{border-bottom:none}
td .bar-wrap{background:#eef1f6;height:5px;border-radius:99px;display:block;width:100%;margin-top:5px;overflow:hidden}
td .bar{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4d7cff,#7ea1ff)}
.stars{color:#f5a623}

/* 趋势图 */
.trend-flex{display:flex;gap:18px;align-items:stretch}
.trend-info{width:170px;min-width:170px;display:flex;flex-direction:column;gap:8px}
.trend-info .kpi{flex:1}
.trend-note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}

/* 评分卡 */
.score-flex{display:flex;gap:22px;align-items:center}
.donut{position:relative;width:132px;height:132px;min-width:132px}
.donut .cen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .cen b{font-size:30px}
.donut .cen span{font-size:11px;color:var(--sub)}
.grade{font-size:12px;font-weight:600;padding:2px 12px;border-radius:99px}
.grade.B{background:var(--green-soft);color:var(--green)}
.dims{flex:1;display:flex;flex-direction:column;gap:9px}
.dim{display:flex;align-items:center;gap:9px;font-size:12px}
.dim .n{width:64px;color:var(--sub)}
.dim .track{flex:1;height:8px;background:#eef1f6;border-radius:99px;overflow:hidden}
.dim .fill{display:block;height:100%;border-radius:99px}
.dim .s{width:46px;text-align:right;font-weight:600}
.dim .w{width:58px;white-space:nowrap;color:#9aa3b8;font-size:11px;text-align:right}
.rec{margin-top:12px;background:var(--green-soft);border-radius:9px;padding:10px 13px;font-size:12.5px;color:#14683a;line-height:1.7}

/* 终止横幅 */
.abort-banner{background:var(--red-soft);border:1px solid #f6cfcf;border-radius:10px;padding:12px 15px;font-size:12.5px;color:#a33;margin:10px 0;display:flex;gap:9px;align-items:flex-start;line-height:1.7}

/* 报告 */
.report{font-size:12.5px;line-height:1.9;color:#333c52}
.report h4{font-size:13px;margin:10px 0 4px;color:var(--txt)}
.report ul{padding-left:18px}
.report li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font:inherit;font-size:12px;cursor:pointer;color:#414c63}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.lv{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 2px}
.lv .lab{font-size:11px;color:var(--sub);width:100%;margin-bottom:-1px}
.kw{font-size:11.5px;padding:3px 10px;border-radius:99px}
.kw.c1{background:var(--primary-soft);color:var(--primary)}
.kw.c2{background:var(--green-soft);color:var(--green)}
.kw.c3{background:var(--orange-soft);color:var(--orange)}

/* 输入区 */
footer{padding:12px 26px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.inbox{max-width:920px;margin:0 auto}
.box{display:flex;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 9px 9px 16px;box-shadow:0 4px 16px rgba(25,45,100,.06)}
.box input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;font-family:inherit}
.box button{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:13.5px;cursor:pointer;font-family:inherit}
.box button:disabled{background:#b9c6ef}
.typing{font-size:12px;color:var(--sub);margin-top:7px;padding-left:4px;display:none}
.typing.show{display:block}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--primary);margin:0 2px;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.fade{animation:fade .4s ease both}
body.noanim .fade,body.noanim .node{animation:none!important;opacity:1!important;transform:none!important}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Product research UI: keep the supplied prototype structure, add responsive and data-state details. */
#chat{overscroll-behavior:contain}.welcome{margin:12px 0;color:var(--sub);line-height:1.7}.welcome h3{color:var(--txt)}
.empty,.data-note{color:var(--sub);font-size:12px;line-height:1.7;padding:9px 2px}.data-note{margin-top:8px}.src-disclaimer{margin-left:auto}
.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:9px}.table-scroll table{min-width:660px}.json{white-space:pre-wrap;overflow:auto;background:#f8f9fc;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12px;line-height:1.6;max-height:300px}.chart{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:9px}.chart svg{width:100%;height:140px}.report-text{white-space:pre-wrap;line-height:1.8;color:#333c52;font-size:13px;overflow-wrap:anywhere}.score-summary{display:flex;gap:8px;align-items:baseline;margin:8px 0 12px}.score-summary b{font-size:30px;color:var(--primary)}.score-summary strong{margin-left:auto}.wide{grid-column:span 2}.box input:focus-visible,.box button:focus-visible,.act:focus-visible,.chip:focus-visible,.mkt button:focus-visible,.history-actions button:focus-visible,#auth-gate input:focus-visible,#auth-gate button:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}
.bar-chart{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(100px,3fr) 52px;gap:10px;align-items:center;font-size:11px;color:var(--sub)}.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-row i,.sentiment-chart i{height:8px;border-radius:99px;background:#edf0f6;overflow:hidden}.bar-row i b,.sentiment-chart i b{display:block;height:100%;border-radius:inherit}.bar-row strong{text-align:right;color:var(--txt);font-weight:600}.sentiment-chart{display:grid;gap:12px}.sentiment-chart>div{display:grid;grid-template-columns:45px 45px 1fr;align-items:center;gap:9px;font-size:12px}.sentiment-chart>div>b{font-weight:600}.keyword-group{display:grid;grid-template-columns:94px 1fr;gap:8px;margin:7px 0;align-items:start;font-size:12px}.keyword-group>b{color:var(--sub);padding-top:4px}.keyword-group>div{display:flex;gap:6px;flex-wrap:wrap}.keyword-group span{padding:3px 9px;background:#edf2ff;color:#3455a1;border-radius:20px}
.report-summary{margin-top:6px;padding:2px 0;color:#26324a}
.report-lead{font-size:15px;font-weight:650;color:#18233a}
.report-headline{margin:8px 0 14px;padding:10px 12px;border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:0 8px 8px 0;color:#294887}
.report-summary h4{margin:13px 0 6px}
.report-list{padding-left:20px;line-height:1.8}
.report-list li{padding:3px 0}
.report-source{display:flex;gap:8px;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}
.report-source b{color:var(--sub);white-space:nowrap}
.report-footnote{margin-top:8px;color:var(--sub);font-size:11px;line-height:1.6}
.tree-list{padding-left:20px;line-height:1.8}
.tree-list li{padding:2px 0}
.tree-list small{margin-left:8px;color:var(--sub)}
@media(max-width:900px){aside{width:190px;min-width:190px}#chat{padding:16px 14px}footer{padding:10px 14px 14px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){body{height:auto;min-height:100vh;overflow:auto;display:block}aside{width:auto;min-width:0;height:auto;min-height:0;overflow:visible;padding:10px 12px;display:block}aside .sec-title,aside .history-list,aside .hist,aside .cache-card{display:none}aside .logo{padding-bottom:8px}.act{display:none}.act.on{display:flex}main{min-height:calc(100vh - 58px)}header{height:auto;min-height:58px;padding:9px 12px;gap:8px;flex-wrap:wrap}header h1{font-size:14px}.mkt{order:3;width:100%;justify-content:space-around}.hd-right{font-size:10px}#chat{flex:1;min-height:45vh;padding:12px 10px}footer{padding:8px 10px 12px}.grid{grid-template-columns:1fr 1fr}.kpi{padding:8px}.kpi .v{font-size:15px}.stage{gap:7px}.s-head b{font-size:12px}.score-flex,.trend-flex{flex-direction:column;align-items:stretch}.trend-info{width:auto;min-width:0;display:grid;grid-template-columns:repeat(3,1fr)}.wide{grid-column:span 2}.src-disclaimer{margin-left:0}.umsg .b{max-width:90%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<aside>
  <div class="logo"><div class="logo-ico">🔍</div><div><b>选品调研 Agent</b><span>Product Research Agent</span></div></div>
  <div class="sec-title">快捷操作</div>
  <button type="button" class="act on" data-act="full" aria-pressed="true"><span class="ic" aria-hidden="true">📊</span>完整选品调研</button>
  <button type="button" class="act" data-act="profit" aria-pressed="false"><span class="ic" aria-hidden="true">💰</span>利润测算</button>
  <button type="button" class="act" data-act="supplier" aria-pressed="false"><span class="ic" aria-hidden="true">🏭</span>供应商寻源</button>
  <button type="button" class="act" data-act="qna" aria-pressed="false"><span class="ic" aria-hidden="true">💬</span>通用问答</button>
  <div class="sec-title">调研历史</div>
  <div id="history-list" class="history-list"><div class="history-empty">完成调研后会显示在这里</div></div>
  <div class="cache-card">
    <b>系统与数据状态</b><br>
    <span id="cache-status"><span class="dot"></span>正在读取系统状态…</span>
  </div>
</aside>

<main>
  <header>
    <h1>选品调研工作台</h1>
    <div class="mkt" id="mkt">
      <button type="button" class="on" aria-pressed="true">US</button><button type="button" aria-pressed="false">UK</button><button type="button" aria-pressed="false">DE</button><button type="button" aria-pressed="false">JP</button><button type="button" aria-pressed="false">CA</button>
    </div>
    <div class="hd-right">
      <span class="badge gray" id="service-status">正在检查服务…</span>
      <span class="badge gray" id="model-status">模型状态待检查</span>
    </div>
  </header>

  <div id="chat" aria-live="polite"><div class="wrap" id="flow"><div class="card welcome"><h3>开始一项选品调研</h3><p>输入品类关键词，或选择左侧快捷任务。分析结果会标明数据来源、置信度和更新时间。</p></div></div></div>

  <footer>
    <div class="inbox">
      <div class="box">
        <input id="inp" aria-label="输入品类关键词或问题" placeholder="输入品类关键词或问题，例如：帮我分析宠物饮水机的市场机会">
        <button id="send" type="button">发 送</button>
      </div>
      <div class="typing" id="typing">Agent 正在处理<i></i><i></i><i></i></div>
      <div class="chips" style="margin-top:9px">
        <button type="button" class="chip" data-q="帮我分析宠物饮水机的市场机会">帮我分析宠物饮水机的市场机会</button>
        <button type="button" class="chip" data-q="计算一下卖 $29.99 的利润">计算一下卖 $29.99 的利润</button>
        <button type="button" class="chip" data-q="找一下宠物饮水机的1688供应商">找一下宠物饮水机的供应商</button>
        <button type="button" class="chip" data-q="宠物用品现在做什么品类好">宠物用品现在做什么品类好</button>
      </div>
    </div>
  </footer>
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
